<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Contacto | Adidas</title>
</head>
<body>

<header class="header">
    <div class="header__menu">
        <img class="header__menu-icon" src="img/Icono menu.png" alt="Icono Menu">
    </div>

    <img class="header__logo" src="img/Logo Adidas.jpg" alt="Logo Adidas">

    <nav class="navbar">
        <a class="nav__link" href="index.html">Inicio</a>
        <a class="nav__link" href="hombres.html">Hombres</a>
        <a class="nav__link" href="mujeres.html">Mujeres</a>
        <a class="nav__link" href="contacto.html">Contacto</a>
    </nav>

    <div class="header__actions">
        <i class="cart-wrapper">
            <img src="img/Icono Carrito.png" alt="Icono de Carrito">

            <section class="cart">
                <h2 class="cart__title">CARRITO</h2>

                <div class="cart__item">
                    <img class="cart__image" src="img/Chamarra.png" alt="">
                    <p>Chamarra</p>
                    <p class="cart__price">$1,700</p>
                    <i class="cart__remove">
                        <img class="cart__remove-img" src="img/Icono-quitar.png" alt="Icono Quitar">
                    </i>
                </div>

                <div class="cart__item">
                    <img class="cart__image" src="img/Chamarra.png" alt="">
                    <p>Chamarra</p>
                    <p class="cart__price">$1,700</p>
                    <i class="cart__remove">
                        <img class="cart__remove-img" src="img/Icono-quitar.png" alt="Icono Quitar">
                    </i>
                </div>

                <div class="cart__item">
                    <img class="cart__image" src="img/Chamarra.png" alt="">
                    <p>Chamarra</p>
                    <p class="cart__price">$1,700</p>
                    <i class="cart__remove">
                        <img class="cart__remove-img" src="img/Icono-quitar.png" alt="Icono Quitar">
                    </i>
                </div>
            </section>
        </i>
    </div>
</header>

<main>

    <section class="banner">
        <h2 class="banner__title">Contacto</h2>
        <p class="banner__text">¿Tienes alguna duda? Escríbenos</p>
    </section>

    <section class="products contact__info">

        <article class="contact__item">
            <h3>Email</h3>
            <p class="contact__text">contacto@adidas.com</p>
        </article>

        <article class="contact__item">
            <h3>Teléfono</h3>
            <p class="contact__text">+52 55 1234 5678</p>
        </article>

        <article class="contact__item">
            <h3>Dirección</h3>
            <p class="contact__text">Ciudad de México, México</p>
        </article>

        <article class="contact__item">
            <h3>Horario</h3>
            <p class="contact__text">Lunes a Viernes: 9:00am - 6:00pm</p>
        </article>

    </section>

</main>

</body>
</html>
